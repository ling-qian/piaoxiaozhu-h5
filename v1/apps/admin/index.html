<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI票小助 · 管理后台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 登录层 -->
<div id="login" class="login-wrap">
  <form class="login-card" id="login-form">
    <div class="logo">🧾</div>
    <h1>AI票小助 · 管理后台</h1>
    <p class="muted">输入管理令牌进入（后端 .env 的 ADMIN_TOKEN）</p>
    <input id="token-input" type="password" placeholder="管理令牌" autocomplete="current-password" required>
    <button type="submit">进入</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">🧾 AI票小助 · 管理后台</div>
    <nav class="tabs">
      <button class="tab active" data-tab="overview">概览</button>
      <button class="tab" data-tab="users">用户</button>
      <button class="tab" data-tab="orders">订单</button>
      <button class="tab" data-tab="points">积分流水</button>
    </nav>
    <button id="logout" class="ghost">退出</button>
  </header>

  <main>
    <!-- 概览 -->
    <section id="panel-overview" class="panel active">
      <div class="cards" id="overview-cards"></div>
      <p class="hint">数据实时统计自数据库；金额为「已支付订单」累计。</p>
    </section>

    <!-- 用户 -->
    <section id="panel-users" class="panel">
      <div class="toolbar">
        <input id="user-keyword" placeholder="搜索昵称 / 手机号 / openid">
        <select id="user-plan">
          <option value="">全部套餐</option>
          <option value="free">免费版</option>
          <option value="pro">专业版</option>
          <option value="enterprise">企业版</option>
        </select>
        <button id="user-search">查询</button>
      </div>
      <div class="table-wrap"><table id="user-table"></table></div>
      <div class="pager" id="user-pager"></div>
    </section>

    <!-- 订单 -->
    <section id="panel-orders" class="panel">
      <div class="toolbar">
        <select id="order-status">
          <option value="">全部状态</option>
          <option value="paid">已支付</option>
          <option value="pending">待支付</option>
        </select>
        <button id="order-search">查询</button>
      </div>
      <div class="table-wrap"><table id="order-table"></table></div>
      <div class="pager" id="order-pager"></div>
    </section>

    <!-- 积分流水 -->
    <section id="panel-points" class="panel">
      <div class="toolbar">
        <select id="points-action"><option value="">全部动作</option></select>
        <input id="points-user" placeholder="用户 ID（可选）">
        <button id="points-search">查询</button>
      </div>
      <div class="table-wrap"><table id="points-table"></table></div>
      <div class="pager" id="points-pager"></div>
    </section>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
